<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Задача 2 - KV с параллаксом</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="instruction">
      <a href="../index.html">← Назад к списку задач</a>
      <h1>KV с параллаксом</h1>
      <p>Кликните слева или справа для переключения слайдов</p>
    </div>
    <div class="kv-container">
      <!-- Слайд 1 (горы + облако) -->
      <div class="slide slide-1 active">
        <div class="layer-bg">
          <img src="../assets/images/task2/горы.jpg" />
        </div>
        <div class="layer-cloud">
          <img src="../assets/images/task2/облако.png" />
        </div>
      </div>

      <!-- Слайд 2 (город + луна) -->
      <div class="slide slide-2">
        <div class="layer-bg">
          <img src="../assets/images/task2/город.jpg" />
        </div>
        <div class="layer-moon">
          <img src="../assets/images/task2/луна.png" />
        </div>
      </div>

      <div class="nav-zone nav-left"></div>
      <div class="nav-zone nav-right"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
