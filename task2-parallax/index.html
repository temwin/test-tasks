<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Задача 2 - KV с параллаксом</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="instruction">
      <a href="../index.html">← Назад к списку задач</a>
      <h1>KV с параллаксом</h1>
      <p>Кликните слева или справа для переключения слайдов</p>
    </div>
    <div class="kv-container">
      <canvas id="webgl-canvas"></canvas>

      <!-- Параллакс-слои -->
      <div class="parallax-layer" id="cloud-layer">
        <img src="../assets/images/task2/clouds.png" alt="cloud" />
      </div>
      <div class="parallax-layer" id="rainbow-layer">
        <img src="../assets/images/task2/rainbow2.png" alt="rainbow" />
      </div>

      <!-- Слайд 1 (фон с горой) -->
      <div class="slide slide-1 active">
        <div class="layer-bg">
          <img src="../assets/images/task2/slide1-bg1.jpeg" />
        </div>
      </div>

      <!-- Слайд 2 (фон с городом) -->
      <div class="slide slide-2">
        <div class="layer-bg">
          <img src="../assets/images/task2/slide2-bg-1.jpeg" />
        </div>
      </div>

      <div class="nav-zone nav-left"></div>
      <div class="nav-zone nav-right"></div>
    </div>

    <script src="webgl-transition.js"></script>
    <script src="script.js"></script>
  </body>
</html>
